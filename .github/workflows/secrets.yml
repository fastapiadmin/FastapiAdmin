name: secrets

# 密钥扫描：防止再次把真实凭据提交进 public 仓库（本仓库历史里出现过 OpenAI Key、
# 旧数据库口令与自签名私钥）。只扫描「本次变更的提交范围」，不做全历史扫描——
# 全历史命中 138 处（主要在仅存于历史的 sql 导出文件与旧 .env 中），需要先清洗历史
# 才可能全绿；当前的职责是拦住**新增**密钥。

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: 密钥扫描（本次变更范围）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史才能按提交范围扫描

      - name: 安装 gitleaks（固定版本 + 校验和）
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: 扫描本次变更范围
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          # 新分支首次推送时 before 是全 0，退化为只扫最新一个提交
          case "$RANGE" in
            *0000000000000000000000000000000000000000*) RANGE="-1" ;;
          esac
          echo "扫描范围: $RANGE"
          gitleaks detect --source . --redact --verbose --log-opts="$RANGE" --exit-code 1
